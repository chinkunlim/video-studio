# ============================================================
# 只提取声音（extract）的工作设定
# 规则：只改「=」右边的值；不要改栏位名称；文字要加双引号；没有就写 ""
# 影片请放在这份工作的 input/ 资料夹
# ============================================================

[job]
type = "extract"                  # 固定，不要改
title = "心研法海報 原始录音"        # 中文标题，随意

[inputs]
video = "original_video.mp4"      # 必填：input/ 里的影片档名
script = ""                       # 选填：有讲稿就填（input/ 里的档名），字幕会用讲稿文字

[options]
range = []                        # 只取一段：["1:30", "2:10"]；全片留 []
voice_samples = false             # true = 依停顿切成 10–20 秒的声音样本（建复制声音用）
transcript = true                 # true = Whisper 逐字稿（会有同音错字，要校对）
subtitles = true                  # true = 对齐原片的繁体字幕（YouTube / PowerPoint / VLC）
